<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoxURL – Page Not Found</title>
  <link rel="icon" href="https://foxurl2.github.io/logo.png">
  <script src="main.js" defer></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #333;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 420px;
    }

    .logo {
      width: 80px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 10px 0;
    }

    p {
      font-size: 16px;
      margin-bottom: 25px;
      color: #555;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      background: #ff7a00;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .btn:hover {
      background: #e86d00;
    }
  </style>
</head>
<body>

  <div class="box">
    <img src="https://foxurl2.github.io/logo.png" class="logo">
    <h1>404 – Page Not Found</h1>
    <p>Looks like this FoxURL doesn’t lead anywhere.  
       The page you’re looking for doesn’t exist.</p>

    <a href="https://foxurl2.github.io/dashboard/" class="btn">Return to Dashboard</a>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoxURL Login</title>
  <link rel="icon" href="https://foxurl2.github.io/logo.png">
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
  <script src="https://foxurl2.github.io/main.js" defer></script>

</head>

<body>

  <div class="login-box">
    <img src="https://foxurl2.github.io/logo.png" class="logo">

    <h1>FoxURL Login</h1>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>

    <p id="error" class="error hidden">Invalid email or password</p>
  </div>

</body>
</html>

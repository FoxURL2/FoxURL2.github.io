<!DOCTYPE html>
<html>
<head>
  <title>FoxURL Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <script src="../main.js" defer></script>
  <script src="dashboard.js" defer></script>
</head>

<body>

  <!-- Top bar -->
  <div id="topbar">
    <button id="createButton">Create</button>
  </div>

  <!-- Create menu -->
  <div id="createMenu" class="hidden">

    <!-- FoxURL section -->
    <div class="section">
      <h3>FoxURL</h3>
      <button class="disabled">Fox Doc</button>
      <button class="disabled">Fox Sheets</button>
      <button class="disabled">Fox Slides</button>
      <button class="disabled">Fox Mail</button>
    </div>

    <!-- Google section -->
    <div class="section" id="googleSection">
      <h3>Google</h3>
      <div id="googleNotLinked">
        <button id="linkGoogleBtn">Link Google</button>
      </div>

      <div id="googleTools" class="hidden">
        <button onclick="FoxURL.createDoc('New Doc')">Google Doc</button>
        <button onclick="FoxURL.createSheet('New Sheet')">Google Sheet</button>
        <button onclick="FoxURL.createSlide('New Slides')">Google Slides</button>
        <button onclick="FoxURL.createForm('New Form')">Google Form</button>
        <button onclick="FoxURL.createDrawing('New Drawing')">Google Drawing</button>
        <button onclick="FoxURL.createColab('New Colab')">Google Colab</button>
        <button onclick="FoxURL.createScript('New Script')">Apps Script</button>
      </div>
    </div>

    <!-- Microsoft section -->
    <div class="section">
      <h3>Microsoft</h3>
      <button class="disabled">Link Microsoft</button>
      <button class="disabled">Word</button>
      <button class="disabled">Excel</button>
      <button class="disabled">PowerPoint</button>
    </div>

  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoxShopping – Your Cloud Synced Shopping List</title>
  <link rel="icon" href="https://foxurl2.github.io/logo.png">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #ff7a00;
      padding: 18px;
      color: white;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
      color: #333;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      background: #ff7a00;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #e86d00;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #fafafa;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #eee;
      animation: fadeIn 0.3s ease;
    }

    .remove {
      background: #d9534f;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-size: 14px;
    }

    .remove:hover {
      background: #c9302c;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #status {
      margin-top: 15px;
      color: #555;
      font-size: 14px;
      text-align: center;
    }

    .account-info {
      margin-top: 25px;
      font-size: 14px;
      color: #777;
      text-align: center;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<header>🦊 FoxShopping</header>

<div class="container">
  <h2>Your Shopping List</h2>

  <div class="input-row">
    <input id="itemInput" type="text" placeholder="Add an item…">
    <button onclick="addItem()">Add</button>
  </div>

  <ul id="list"></ul>

  <p id="status"></p>
  <p id="accountInfo" class="account-info"></p>
</div>

<script>
  let shoppingList = [];
  let userEmail = localStorage.getItem("foxurl_email");
  let apiData = null;

  async function loadAPI() {
    apiData = await fetch("../api.json").then(r => r.json());
  }

  async function loadShoppingList() {
    if (!userEmail) {
      document.getElementById("status").textContent = "You must be logged in to use FoxShopping.";
      return;
    }

    const endpoint = apiData.google.endpoint;

    const res = await fetch(endpoint, {
      method: "POST",
      body: JSON.stringify({
        action: "read",
        email: userEmail
      })
    });

    const data = await res.json();

    if (data.status === "OK") {
      try {
        shoppingList = JSON.parse(data.list || "[]");
      } catch {
        shoppingList = [];
      }
    }

    renderList();
  }

  function renderList() {
    const ul = document.getElementById("list");
    ul.innerHTML = "";

    shoppingList.forEach((item, index) => {
      const li = document.createElement("li");
      li.innerHTML = `
        ${item}
        <span class="remove" onclick="removeItem(${index})">Remove</span>
      `;
      ul.appendChild(li);
    });
  }

  async function saveToCloud() {
    document.getElementById("status").textContent = "Saving to FoxCloud…";

    const endpoint = apiData.google.endpoint;

    await fetch(endpoint, {
      method: "POST",
      body: JSON.stringify({
        action: "write",
        email: userEmail,
        value: JSON.stringify(shoppingList)
      })
    });

    document.getElementById("status").textContent = "Saved!";
    setTimeout(() => {
      document.getElementById("status").textContent = "";
    }, 1500);
  }

  function addItem() {
    const input = document.getElementById("itemInput");
    const value = input.value.trim();
    if (!value) return;

    shoppingList.push(value);
    input.value = "";
    renderList();
    saveToCloud();
  }

  function removeItem(index) {
    shoppingList.splice(index, 1);
    renderList();
    saveToCloud();
  }

  function updateAccountInfo() {
    const info = document.getElementById("accountInfo");

    if (userEmail) {
      info.textContent = "Logged in as: " + userEmail;
    } else {
      info.textContent = "Not logged in";
    }
  }

  // INIT
  (async () => {
    await loadAPI();
    await loadShoppingList();
    updateAccountInfo();
  })();
</script>

</body>
</html>
